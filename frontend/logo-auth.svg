<svg width="220" height="50" viewBox="0 0 220 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="authBowl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ecf8e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="authText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Logo Icon -->
  <g transform="translate(6, 5)">
    <path d="M 8 22 C 8 34, 32 34, 32 22 Z" fill="url(#authBowl)" filter="url(#glow)"/>
    <ellipse cx="20" cy="22" rx="12" ry="4" fill="#4ade80" opacity="0.7"/>
    <path d="M 14 19 Q 20 9 26 15 Q 20 22 14 19 Z" fill="#86efac"/>
    <circle cx="26" cy="13" r="2" fill="#facc15"/>
    <circle cx="14" cy="15" r="2" fill="#f87171"/>
  </g>
  <!-- Text Brand -->
  <text x="48" y="33" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="26" fill="url(#authText)" letter-spacing="-0.5">Nutri<tspan fill="#3ecf8e">Track</tspan></text>
</svg>