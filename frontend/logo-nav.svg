<svg width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navBowl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ecf8e"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="navText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Logo Icon -->
  <g transform="translate(4, 4)">
    <!-- Bowl Base -->
    <path d="M 6 18 C 6 27, 26 27, 26 18 Z" fill="url(#navBowl)"/>
    <!-- Bowl Rim -->
    <ellipse cx="16" cy="18" rx="10" ry="3" fill="#4ade80" opacity="0.6"/>
    <!-- Leaf / Salad Sparkle -->
    <path d="M 12 16 Q 16 8 20 13 Q 16 18 12 16 Z" fill="#86efac"/>
    <circle cx="21" cy="11" r="1.5" fill="#facc15"/>
    <circle cx="11" cy="13" r="1.5" fill="#f87171"/>
  </g>
  <!-- Text Brand -->
  <text x="40" y="26" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="url(#navText)" letter-spacing="-0.5">Nutri<tspan fill="#3ecf8e">Track</tspan></text>
</svg>