name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint backend with ruff
        run: |
          # E9/F: syntax errors and undefined names only — fails the build.
          # Everything else (style nitpicks) is reported but non-blocking for now.
          ruff check backend/ --select=E9,F --output-format=github
          ruff check backend/ --exit-zero

      - name: Run tests
        run: pytest backend/test_app.py backend/tests/ -v
        env:
          # Intentionally left unset so the health-check and 401 paths are
          # exercised the same way they would be on a misconfigured deploy.
          SUPABASE_URL: ""
          SUPABASE_KEY: ""