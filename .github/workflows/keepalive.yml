name: Keep Supabase Awake

on:
  schedule:
    # Runs every 3 days at midnight UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    # Allows you to run this workflow manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        # SUPABASE_ANON_KEY must be added under
        # Settings → Secrets and variables → Actions → New repository secret.
        # (This is the public anon key, already exposed in frontend/App.js —
        # moving it to a secret here is just for easier rotation, not because
        # it was a new leak.)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --request GET \
            --url 'https://agzopmiiswitorldacud.supabase.co/rest/v1/base_foods?select=id&limit=1' \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}"