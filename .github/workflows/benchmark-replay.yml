name: Benchmark Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 00:00 UTC to catch regressions
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  verify-benchmark:
    name: 200-Meal Benchmark Replay
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify dataset checksum
      run: |
        python benchmark/run_benchmark.py --verify-checksum

    - name: Run 200-meal benchmark
      run: |
        python benchmark/run_benchmark.py --output dist/ci_replicated_results.json

    - name: Run held-out active learning suite
      run: |
        python tests/test_active_learning_heldout.py

    - name: Run food search integration tests
      run: |
        python tests/test_search_aliases.py

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          dist/ci_replicated_results.json
          benchmark/active_learning_heldout_results.json
