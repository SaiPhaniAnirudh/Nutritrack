name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 36 & Accept Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/nutritrack-debug.apk
          echo "APK generated successfully at dist-apk/nutritrack-debug.apk"
          ls -lh dist-apk/

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutritrack-apk
          path: dist-apk/nutritrack-debug.apk
          retention-days: 30

      - name: Create GitHub Release (If tagged or manual release)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: NutriTrack Android APK ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ## NutriTrack AI Mobile Release
            Download and install the Android `.apk` directly onto your smartphone or tablet.

            - **File:** `nutritrack-debug.apk`
            - **Platform:** Android 8.0+
            - **Features:** AI Food Intelligence, Nutrition Scanner, Meal Fusion Engine.
          files: dist-apk/nutritrack-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
